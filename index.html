<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>客服 AI 回覆站 · 服務終端</title>
<link rel="icon" href="../../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --color-primary:#0D9488;
  --color-on-primary:#000000;
  --color-secondary:#14B8A6;
  --color-on-secondary:#0F172A;
  --color-accent:#EA580C;
  --color-on-accent:#000000;
  --color-background:#F0FDFA;
  --color-foreground:#134E4A;
  --color-card:#FFFFFF;
  --color-card-foreground:#134E4A;
  --color-muted:#E8F1F4;
  --color-muted-foreground:#475569;
  --color-border:#99F6E4;
  --color-destructive:#DC2626;
  --color-on-destructive:#FFFFFF;
  --color-ring:#0D9488;

  --blue:#0369A1;
  --ink:#134E4A;
  --muted:#475569;
  --line:#99F6E4;

  --ok:#047857;
  --warn:#9A3412;
  --bad:#B91C1C;
  --purple:#6D28D9;
  --shadow:0 14px 36px rgba(15,118,110,.08);
  --shadow-sm:0 5px 16px rgba(15,118,110,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  color:var(--color-foreground);
  background:
    linear-gradient(rgba(13,148,136,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.035) 1px,transparent 1px),
    var(--color-background);
  background-size:32px 32px;
  font-family:"Inter","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,a,[role="button"]{cursor:pointer}
button{font:inherit}
button:focus-visible,[role="button"]:focus-visible,a:focus-visible{
  outline:3px solid rgba(13,148,136,.34);
  outline-offset:3px;
}
svg{display:block}
.icon{width:19px;height:19px;flex:none;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:24px;
  min-height:72px;
  padding:10px clamp(16px,3vw,40px);
  border-bottom:1px solid rgba(13,148,136,.2);
  background:rgba(255,255,255,.92);
  box-shadow:0 1px 12px rgba(15,118,110,.05);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  flex:none;
  color:#fff;
  background:var(--color-primary);
  border-radius:8px;
  box-shadow:5px 5px 0 #CCFBF1;
}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.nav{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  display:flex;
  align-items:center;
  gap:7px;
  flex:none;
  min-height:42px;
  padding:9px 11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:7px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  transition:color .2s ease,background .2s ease,border-color .2s ease,transform .2s ease;
}
.nav button:hover{color:var(--ink);background:#F0FDFA;border-color:var(--line)}
.nav button.on{color:#fff;background:var(--color-primary);border-color:var(--color-primary)}
.nav button:active{transform:translateY(1px)}
.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.status-mark{display:grid;place-items:center;width:18px;height:18px;color:var(--ok);background:#D1FAE5;border-radius:50%}
.status-mark .icon{width:12px;height:12px;stroke-width:2.5}
.wrap{width:min(1380px,100%);margin:auto;padding:clamp(22px,4vw,48px) clamp(16px,3vw,40px) 56px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px}
.eyebrow{margin-bottom:7px;color:var(--color-primary);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.head h1{margin:0;font-size:clamp(25px,3vw,38px);line-height:1.15;letter-spacing:-.045em}
.head p{max-width:720px;margin:8px 0 0;color:var(--muted);font-size:13px}
.head-side{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:7px 10px;
  color:var(--ink);
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:var(--shadow-sm);
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
}
.chip .icon{width:15px;height:15px;color:var(--color-primary)}
.grid{display:grid;gap:14px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpirow{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}
.split-72{grid-template-columns:minmax(0,2fr) minmax(250px,1fr)}
.split-64{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.split-46{grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr)}
.panel,.kpi,.gapcard,.compcard,.face{
  min-width:0;
  background:var(--color-card);
  border:1px solid var(--line);
  border-radius:9px;
  box-shadow:var(--shadow-sm);
}
.panel{padding:18px}
.panel h2{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 15px;
  font-size:13px;
  letter-spacing:-.01em;
}
.panel h2 .icon{color:var(--color-primary)}
.sub{color:var(--muted);font-size:11px;font-weight:400}
.kpi{
  position:relative;
  overflow:hidden;
  padding:16px;
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--color-primary)}
.kpi:hover{transform:translateY(-2px);border-color:var(--color-primary);box-shadow:var(--shadow)}
.kpi-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;font-weight:600}
.kpi-label .icon{width:16px;height:16px;color:var(--color-primary)}
.kpi-value{margin-top:8px;color:var(--ink);font-size:27px;font-weight:700;line-height:1.15;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.kpi-value small{margin-left:3px;color:var(--muted);font-size:12px;letter-spacing:0}
.delta{display:flex;align-items:center;gap:4px;margin-top:7px;font-size:11px;font-weight:600}
.delta .icon{width:13px;height:13px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.chart{width:100%;height:280px}
.chart.sm{height:220px}
.chart.lg{height:320px}
.scrollx{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{
  padding:10px;
  color:var(--muted);
  background:#F0FDFA;
  border-bottom:1px solid var(--line);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-align:left;
  text-transform:uppercase;
  white-space:nowrap;
}
td{padding:11px 10px;border-bottom:1px solid #D5F5EF;vertical-align:middle;white-space:nowrap}
tbody tr{transition:background .2s ease}
tbody tr:hover{background:#F0FDFA}
tbody tr:last-child td{border-bottom:0}
td:nth-child(n+3){font-variant-numeric:tabular-nums}
.tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 8px;
  border:1px solid currentColor;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
  line-height:1.2;
  white-space:nowrap;
}
.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.t-ok{color:#047857;background:#ECFDF5}
.t-warn{color:#9A3412;background:#FFF7ED}
.t-bad{color:#B91C1C;background:#FEF2F2}
.t-blue{color:#0369A1;background:#F0F9FF}
.t-acc{color:#C2410C;background:#FFF7ED}
.t-purple{color:#6D28D9;background:#F5F3FF}
.t-mut{color:#475569;background:#F8FAFC}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
.bar{height:7px;min-width:60px;overflow:hidden;background:#DCEAEF;border-radius:2px}
.bar>i{display:block;height:100%;background:var(--color-primary)}
.avatar{
  display:inline-grid;
  place-items:center;
  width:28px;
  height:28px;
  flex:none;
  color:#fff;
  border-radius:7px;
  font-size:10px;
  font-weight:700;
}
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.convlist{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}
.conv{
  display:flex;
  gap:10px;
  min-height:79px;
  padding:11px 12px;
  border-bottom:1px solid #D5F5EF;
  transition:background .2s ease;
}
.conv:last-child{border-bottom:0}
.conv:hover{background:#F0FDFA}
.conv.act{padding-left:9px;background:#ECFDFB;border-left:3px solid var(--color-primary)}
.chan{display:grid;place-items:center;width:25px;height:25px;flex:none;color:#fff;border-radius:6px}
.chan .icon{width:14px;height:14px}
.who{font-size:12px;font-weight:700}
.pre{max-width:210px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px;color:var(--muted);font-size:10px}
.thread{display:flex;flex-direction:column;gap:11px;padding:15px;background:#F8FFFE;border:1px solid var(--line);border-radius:8px}
.msg{max-width:82%;padding:11px 13px;border-radius:8px;font-size:12px}
.msg.cust{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:2px}
.msg.agent{align-self:flex-end;color:#0F3F3B;background:#CCFBF1;border:1px solid #5EEAD4;border-bottom-right-radius:2px}
.mh{margin-bottom:4px;color:var(--muted);font-size:10px}
.draft{margin-top:14px;padding:15px;background:#FFF7ED;border:1px solid #FDBA74;border-left:4px solid var(--color-accent);border-radius:8px}
.dh{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:#9A3412;font-size:12px;font-weight:700}
.cite{display:inline-flex;align-items:center;gap:5px;margin:2px 4px 2px 0;padding:4px 8px;color:#0F766E;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:10px}
.cite .icon{width:13px;height:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:40px;
  padding:8px 13px;
  color:var(--ink);
  background:#fff;
  border:1px solid #5EEAD4;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.btn:hover{background:#F0FDFA;border-color:var(--color-primary);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn.pri{color:#fff;background:var(--color-accent);border-color:var(--color-accent)}
.btn.pri:hover{background:#C2410C;border-color:#C2410C}
.btn .icon{width:16px;height:16px}
.kbrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #D5F5EF}
.kbrow:last-child{border-bottom:0}
.kbico{display:grid;place-items:center;width:34px;height:34px;flex:none;background:#F0FDFA;border:1px solid var(--line);border-radius:7px;font-weight:700}
.gapcard{padding:14px;box-shadow:none}
.q{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;font-weight:700}
.slabar{position:relative;height:26px;overflow:hidden;background:#E2E8F0;border:1px solid #CBD5E1;border-radius:4px}
.slabar .fill{position:absolute;inset:0 auto 0 0}
.slabar .lbl{position:absolute;inset:0 7px 0 auto;display:flex;align-items:center;color:#0F172A;font-size:10px;font-weight:700}
.compcard{padding:14px;box-shadow:none}
.amt{margin-top:13px;color:#C2410C;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.appr{display:flex;gap:5px;margin-top:12px}
.stepdot{position:relative;flex:1;color:var(--muted);font-size:9px;text-align:center}
.stepdot i{display:block;width:10px;height:10px;margin:0 auto 5px;background:#CBD5E1;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #CBD5E1}
.stepdot.done i{background:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.stepdot.cur{color:#9A3412;font-weight:700}
.stepdot.cur i{background:var(--color-accent);box-shadow:0 0 0 3px #FFEDD5}
.facegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.face{padding:12px 5px;text-align:center;box-shadow:none}
.face .icon{width:29px;height:29px;margin:auto}
.face .n{margin-top:5px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.face .p{color:var(--muted);font-size:9px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:10px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;vertical-align:middle}
.foot{margin-top:28px;color:var(--muted);font-size:10px;text-align:center}
.mt14{margin-top:14px}
.grid-item{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.grid-item:nth-child(2){animation-delay:.05s}
.grid-item:nth-child(3){animation-delay:.1s}
.grid-item:nth-child(4){animation-delay:.15s}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:1050px){
  .topbar{grid-template-columns:auto 1fr}.status{display:none}
  .kpirow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .topbar{display:flex;gap:12px;flex-wrap:wrap}
  .brand{flex:1}
  .nav{order:3;width:100%;padding-bottom:1px}
  .head{align-items:flex-start;flex-direction:column}
  .head-side{justify-content:flex-start}
  .g2,.g3,.split-72,.split-64,.split-46,.inbox{grid-template-columns:1fr}
}
@media(max-width:560px){
  .wrap{padding-left:12px;padding-right:12px}
  .topbar{padding:9px 12px}
  .brand small{display:none}
  .nav button{min-width:42px;justify-content:center;padding:9px}
  .nav .lab{display:none}
  .kpirow{grid-template-columns:1fr 1fr;gap:9px}
  .kpi{padding:13px}
  .kpi-value{font-size:22px}
  .panel{padding:14px}
  .facegrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .msg{max-width:94%}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

var SCREENS=[s0,s1,s2,s3,s4,s5],active=0;
function show(i,updateHash){
  i=Math.max(0,Math.min(SCREENS.length-1,i|0));
  active=i;
  disposeCharts();
  document.querySelectorAll("#nav button").forEach(function(b){
    var on=+b.dataset.i===i;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
  });
  SCREENS[i]();
  if(updateHash&&location.hash!=="#v"+i)location.hash="v"+i;
}
(function(){
  document.getElementById("nav").innerHTML=NAV.map(function(n,i){return '<button type="button" data-i="'+i+'" aria-label="'+n.name+'">'+icon(n.ico)+'<span class="lab">'+n.name+'</span></button>'}).join("");
  document.getElementById("nav").addEventListener("click",function(e){
    var b=e.target.closest("button[data-i]");
    if(b)show(+b.dataset.i,true);
  });
})();
function fromHash(){
  var m=(location.hash||"").match(/(?:go=|v)([0-9]+)/);
  show(m?Math.min(+m[1],5):0,false);
  try{window.scrollTo(0,0)}catch(e){}
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("resize",function(){charts.forEach(function(c){c.resize()})});
document.addEventListener("visibilitychange",function(){if(!document.hidden)charts.forEach(function(c){c.resize()})});
fromHash();
</script>
